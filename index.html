+card('d','mon','My DSRs',`<label class="sx">${I('srch')}<input data-i="dq" placeholder="Search DSRs" value="${es(S.dq)}"></label><div id="gdl">${dsrL()}</div>`)
+card('s','share','My Shares',[['Globex pricing pack','4 docs · Lena Ortiz · Nov 19','12 views'],['Initech discovery recap','2 docs · Priya Nair · Nov 18','3 views']].map(x=>`<div class="li" data-a="ts" data-v="Share analytics open in the full product"><div class="tt"><div>${x[0]}</div><div class="mu">${x[1]}</div></div><span class="mu">${x[2]}</span></div>`).join(''))
+card('l','cap','My Learning',`<label class="sx">${I('srch')}<input data-i="lq" placeholder="Search courses" value="${es(S.lq)}"></label><div id="gll">${lrnL()}</div>`)}
const dsrL=()=>DS.filter(x=>x[0].toLowerCase().includes(S.dq.toLowerCase())).map(x=>`<div class="li" data-a="gd" data-v="${x[2]}"><span class="sq">N</span><div class="tt"><div class="bl">${x[0]}</div><div class="mu">${x[1]}</div></div></div>`).join('')||'<div class="mu">No DSRs match.</div>';
const lrnL=()=>LR.filter(x=>x[0].toLowerCase().includes(S.lq.toLowerCase())).map(x=>`<div class="li">${I('doc')}<div class="tt"><div>${x[0]}</div><div class="mu">${x[1]}/${x[2]} units</div></div><span class="mu">${Math.round(x[1]/x[2]*100)}%</span><button class="sm" data-a="ts" data-v="Course opens in the full product">${x[1]?'Resume':'Start'}</button></div>`).join('')||'<div class="mu">No courses match.</div>';
const gen=(k,f)=>{const g=S.d+k;if(S.g[g]==2)return f();if(!S.g[g]){S.g[g]=1;setTimeout(()=>{S.g[g]=2;if((S.tab=='deal'||S.mp!=null)&&!S.ch)rBody()},1300)}return`<div class="gn">${I('spark','f')}Generating Content...</div>`};
function deal(){const d=D[S.d];const hdr=`<div class="dh"><div class="drw"><button class="sel" data-a="dd"><b>${d?d.n:'Select a deal'}</b><span style="display:flex;gap:6px;color:var(--m)">${d?`<span data-a="dclr">${I('x')}</span>`:''}${I('down')}</span></button><button class="ib ${S.key?'on':''}" data-a="key" data-tip="Key deal">${I('crown')}</button><button class="ib cl" data-a="ts" data-v="Opens the opportunity in Salesforce" data-tip="Open in CRM">${I('cloud','f')}</button></div>${d?`<div class="chp">${pl(d.st)}${pl(d.am)}${pl(d.cl)}</div>`:''}${S.menu=='dd'?`<div class="pop" style="top:58px;bottom:auto">${Object.keys(D).map(k=>`<button class="${k==S.d?'on':''}" data-a="sd" data-v="${k}">${D[k].n}</button>`).join('')}</div>`:''}</div>`;
if(!d)return hdr+`<div class="emp">${I('srch')}Pick a deal above, or open an email from a prospect and the deal loads on its own.</div>`;
const x=d.dsr;return hdr+`<div class="cd ds"><div class="fr"><span class="sq">${d.co[0]}</span><div style="flex:1"><b>${x[0]}</b> ${pl('DSR','bb')}<div class="mu">${x[1]} · last activity ${x[2]}</div></div><button class="ic" data-a="ts" data-v="DSR link copied">${I('copy')}</button><button class="ic" data-a="ts" data-v="Opens the Digital Sales Room">${I('ext')}</button></div><div class="dst"><span>${I('eye')}${x[3]}</span><span>${I('users')}${x[4]}</span><span>${I('file')}${x[5]}</span><button class="sm" style="margin-left:auto" data-a="ts" data-v="Pick content to add to the DSR">${I('plus')}Add</button></div></div>`+SEC.map(([k,t])=>acc(k,t,d)).join('')}
function acc(k,t,d){const op=S.o.has(k),ex=(GK.includes(k)||k=='ar')&&op?`<button class="gb" data-a="regen" data-v="${k}">${I('spark')}Generate</button>`:k=='sn'&&op?`<span class="vt"><button class="${S.grid?'':'on'}" data-a="grid" data-v="0">${I('lines')}</button><button class="${S.grid?'on':''}" data-a="grid" data-v="1">${I('grid')}</button></span>`:'';
return`<div class="ac"><div class="ah" data-a="tg" data-v="${k}">${t}${ex}${I(op?'down':'chev')}</div>${op?`<div class="ab">${AIK.includes(k)?gen(k,()=>F[k](d)):F[k](d)}</div>`:''}</div>`}
const addb=n=>`<button class="ad2b" data-a="radd" data-v="${n}">+Add</button>`;
const RK={nd:(x,id,d)=>{const ci=S.o.has('ci'+id),as=S.o.has('as'+id),rs=S.o.has('rs'+id);return`<div class="it"><span class="ico">${I('bld')}</span><div class="tt"><b>${x[0]}</b></div>${st(x[1])}<button class="ic" data-a="tg" data-v="rs${id}" aria-label="Why recommended">${I('info')}</button></div>${rs?`<div class="rsn fi"><b>Reasons for recommendation</b>${ul(['Industry: '+x[2],'Products purchased: '+x[3],'Won against: '+d.cp])}</div>`:''}<div class="cib" data-a="tg" data-v="ci${id}">Customer Info${I(ci?'down':'chev')}</div>${ci?`<div class="cig fi">${[['Industry',x[2]],['Products',x[3]],['Health',pl(x[4],'lo')],['Customer since',x[5]],['Outcome',x[6]]].map(q=>`<div class="mu">${q[0]}</div><div>${q[1]}</div>`).join('')}</div>`:''}<div class="cib" data-a="tg" data-v="as${id}">Assets <span class="ok">${x[7].length}</span>${I(as?'down':'chev')}</div>${as?x[7].map(q=>`<div class="it">${ft(q[1])}<div class="tt">${q[0]}</div>${addb(q[0])}</div>`).join(''):''}`},
as:x=>`<div class="it">${ft(x[1])}<div class="tt"><div>${x[0]}</div><div class="mu">${x[3]}</div></div>${st(x[2])}${addb(x[0])}</div>`,
fq:(x,id)=>`<div class="fq" data-a="tg" data-v="fq${id}" style="cursor:pointer;margin-top:6px"><b>${x[0]}</b>${S.o.has('fq'+id)?`<div>${x[1]}</div>`:''}</div>`,
gq:x=>`<div class="ck" style="cursor:default">${pl('Q','bb')}<span>${x}</span></div>`,
co:x=>`<div class="it">${ft('vid')}<div class="tt"><div>${x[0]}</div><div class="mu">${x[1]} · bite-sized</div></div><button class="sm" data-a="ts" data-v="${x[0]} opens in the full product">Start</button></div>`,
pe:(x,id)=>{const o=S.o.has('pe'+id);return`<div class="cib" data-a="tg" data-v="pe${id}">${x[0]}${I(o?'down':'chev')}</div>${o?`<div class="tpb fi"><b>Goals</b><p style="margin-top:2px">${x[1]}</p><b>What wins them over</b><p style="margin-top:2px">${x[2]}</p></div>`:''}`}};
const ul=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const F={
mt:d=>'<div class="lb">Past meetings</div>'+d.mt.map((m,i)=>{const mo=S.o.has('mt:m'+i),ao=S.o.has('mt:a'+i);return`<div class="mtg"><div><b>${m[0]}</b> <span class="mu">${m[1]}</span></div><div class="mr"><div class="th">${I('play')}<span>${m[3]}</span></div><div><div><b>${m[2]}</b></div><div class="mav">${parseInt(m[3])}m <i>${ini(d.ppl[d.pc][0])}</i><i>MT</i>${pl(m[4],'g')}</div></div></div><p class="mss ${mo?'':'cl3'}">${m[5]}</p>${mo?'':`<button class="lk" data-a="tg" data-v="mt:m${i}">More</button>`}<div class="aib" data-a="tg" data-v="mt:a${i}">Action items ${pl(m[6].length,'g')}${I(ao?'down':'chev')}</div>${ao?ul(m[6]):''}</div>`}).join(''),
ar:d=>[['fi','Company Firmographics'],['il','Industry Landscape'],['ch','Sales and Revenue Enablement Challenges'],['pm','People Map / Hierarchy']].map(([k,t])=>{const op=S.o.has('ar:'+k);return`<div class="srw" data-a="tg" data-v="ar:${k}">${I(op?'down':'chev')}${t}<span class="in">${I('info')}</span></div>${op?`<div class="md" style="padding:0 0 10px 22px">${gen(k,()=>F[k](d))}</div>`:''}`}).join(''),
su:d=>`<div class="md"><p>${d.sum}</p><h4>Next step</h4><p>${d.nx[0]}.</p></div>`,
fu:d=>d.nx.map((n,i)=>{const k=S.d+i,on=S.done.has(k);return`<div class="ck ${on?'on':''}" data-a="dn" data-v="${k}"><i>${on?I('chk'):''}</i><span>${n}</span></div>`}).join(''),
sn:d=>`<div class="sng ${S.grid?'g':''}">`+[['Opportunity > Products',d.pr],['Opportunity > Competitors',d.cp],['Opportunity > Integration',d.ig],['Stage Name',d.st],['Amount',d.af],['Close Date',d.cl],['Owner','Matthew Torres']].map(r=>S.grid?`<div><div class="mu">${r[0]}</div>${r[1]}</div>`:`<div class="k">${r[0]}</div><div>${r[1]}</div>`).join('')+'</div>',
rc:d=>RC.map(([n,k,it],i)=>{const op=S.o.has('rc:'+i);return`<div class="rcr ${op?'on':''}" data-a="tg" data-v="rc:${i}">${I(op?'down':'chev')}${n}: <span class="cnt">${it.length}</span></div>${op?`<div class="rci">${it.map((x,j)=>RK[k](x,i+'.'+j,d)).join('')}</div>`:''}`}).join(''),
cpl:d=>`<div class="md"><h4>Objective</h4><p>${d.nx[0]}.</p><h4>Agenda</h4>${ul(['Recap what changed since the last call','Review open action items','Handle the '+d.cp+' comparison','Agree on the next step and owner'])}<h4>Desired outcome</h4><p>A dated next step before ${d.cl.split(',')[0]}.</p></div>`,
dp:d=>{const s=['Discovery','Qualification','Evaluation','Negotiation','Closed'],i=s.indexOf(d.st);return`<div class="dpg">${s.map((x,j)=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div><div class="mu">${d.st}, stage ${i+1} of 5 · ${d.af} · closes ${d.cl}</div>`},
ac2:d=>{const c=d.ppl[d.pc][0],eb=d.ppl.find(p=>p[3]=='Economic buyer')[0];return[['Email from '+c,'2h ago'],['Meeting: '+d.mt[0][2],d.mt[0][1]],[`DSR viewed ${d.dsr[3]} times`,d.dsr[2]],['Proposal opened by '+eb,'yesterday']].map(x=>`<div class="avt"><i></i><div><div>${x[0]}</div><div class="mu">${x[1]}</div></div></div>`).join('')},
rk:d=>d.rk.map(r=>`<div class="ck" style="cursor:default">${pl({hi:'High',md:'Medium',lo:'Low'}[r[0]],r[0])}<span>${r[1]}</span></div>`).join(''),
sh:d=>{const all=S.o.has('sh:all'),L=all?d.ppl:d.ppl.slice(0,3);return L.map(p=>`<div class="pp"><span class="av">${p[0][0]}</span><div><b>${p[0]}</b> <span class="ad">${I('uadd')}</span><div class="mu">${p[1]} ${I('mail')}</div></div><div class="ppm"><span>${I('cal')}${p[4]}</span><span>${I('share')}${p[5]}</span></div></div>`).join('')+(d.ppl.length>3?`<button class="lk" data-a="tg" data-v="sh:all">${all?'Show less':`Show ${d.ppl.length-3} more`}</button>`:'')},
fi:d=>`<div class="md"><h3>Company Firmographics: ${d.co}</h3><h4>Company Name</h4><ul><li><b>Legal Name:</b> ${d.co}, Inc.</li><li><b>Website:</b> <a>${d.dom}</a></li><li><b>Founded:</b> ${d.fd}</li><li><b>Headquarters:</b> ${d.hq}</li><li><b>Business Model:</b> B2B</li><li><b>Company Type:</b> Privately held</li></ul><h4>Number of Employees</h4><p>${d.co} has about <b>${d.emp} employees</b> based on public profiles and CRM records.</p><h4>Industry</h4><p>${d.co} operates in <b>${d.ind}</b>.</p><h4>Leadership</h4><table><tr><th>Name</th><th>Title</th></tr>${d.ppl.slice(0,4).map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td></tr>`).join('')}</table></div>`,
il:d=>`<div class="md"><h3>${d.co}: Industry Landscape</h3><p><b>Industry:</b> ${d.ind} | <b>HQ:</b> ${d.hq}</p><h4>What is shifting</h4>${ul(d.tr)}<h4>Competitive context</h4><p>The main alternative in this deal is <b>${d.cp}</b>.</p></div>`,
ch:d=>`<div class="md"><h3>Account Research Report: ${d.co}</h3><h4>Enablement challenges</h4><table><tr><th>Challenge</th><th>Revenue lever</th></tr>${d.pn.map(p=>`<tr><td>${p[0]}</td><td>${LV[p[1]]}</td></tr>`).join('')}</table></div>`,
sp:d=>`<div class="mu" style="margin-bottom:4px">Suggested for ${d.co}</div>`+[2,0,13].map((i,j)=>{const on=S.sp.has(j);return`<div class="ck" data-a="spk" data-v="${j}"><i style="${on?'background:var(--b);border-color:var(--b)':''}">${on?I('chk'):''}</i>${ft(A[i][1])}<span>${A[i][0]}</span></div>`}).join('')+`<button class="bt" style="margin-top:8px" data-a="spl">${I('share')}Create share link</button>`,
pm:d=>`<div class="md"><h3>People Map: ${d.co}</h3></div>`+[...d.ppl].sort((a,b)=>a[2]-b[2]).map(p=>`<div class="tre" style="margin-left:${p[2]*16}px"><b>${p[0]}</b> ${pl(p[3],p[3]=='Champion'?'lo':p[3].includes('blocker')?'hi':'g')}<div class="mu">${p[1]}</div></div>`).join('')};
function content(){let h=`<div style="position:relative" class="csw"><label class="sx" style="margin:0;padding:8px 10px">${I('srch')}<input data-i="cq" placeholder="Search" value="${es(S.cq)}">${I('sld')}</label><div id="csd">${S.cf?csd():''}</div></div>`;
if(!S.cp.length)return h+`<div class="cd" style="padding:6px 10px">${[['Favorites','star'],['My Folder','fold'],['FAQs','info'],['Library','lib'],['Views','eye'],['Shared With Me','users'],['Workspace','bld']].map(([n,i])=>`<div class="li" data-a="cp" data-v="${n}">${I(i)}<div class="tt">${n}</div></div>`).join('')}</div><div class="cd"><div class="li" style="padding:12px 14px" data-a="cp" data-v="Templates">${I('lines')}<div class="tt">Templates</div>${pl(TP.length,'g')}</div></div>`;
if(S.cp[0]=='Templates')return h+tpv();
let node=S.cp[0]=='FAQs'?0:S.cp.reduce((n,k)=>n[k],TREE);
h+=`<div class="cd"><div class="bc"><button data-a="cp" data-v="">Content</button>${S.cp.map((c,i)=>` &gt; <button data-a="cpi" data-v="${i}">${c}</button>`).join('')}</div><div style="padding:6px 12px 12px">`;
if(!node)return h+FQ.map((f,i)=>`<div class="fq"><b>${f[0]}</b><div>${f[1]}</div>${pl('FAQ','g')}<button class="ad2" data-a="fqa" data-v="${i}">+Add</button></div>`).join('')+'</div></div>';
if(Array.isArray(node))return h+`<label class="sx">${I('srch')}<input data-i="fq" placeholder="Search folders / files" value="${es(S.fq)}"></label><div id="gfl">${fl(node)}</div></div></div>`;
return h+Object.keys(node).map(k=>`<div class="li" data-a="cpd" data-v="${k}">${I('fold')}<div class="tt">${k}</div>${I('chev')}</div>`).join('')+'</div></div>'}
const ft=t=>`<span class="ft ${t}">${{pdf:'PDF',vid:'▶',pg:'GB',doc:'DOC'}[t]}</span>`;
const arow=i=>`<div class="li cfl" data-a="ts" data-v="Opening ${A[i][0]}">${ft(A[i][1])}<div class="tt"><div>${A[i][0]}</div></div><span class="mu">${I('fold')}${A[i][2]}</span></div>`;
const fl=n=>{const r=n.filter(i=>A[i][0].toLowerCase().includes(S.fq.toLowerCase()));return r.length?r.map(arow).join(''):`<div class="emp">${I('fold')}No data found</div>`};
const fil=s=>{const m=S.v=='mail'&&S.mo!=null?M[S.mo]:0,dd=D[S.d],fn=S.cm&&/^[a-z]/i.test(S.cm.to)?cap(S.cm.to.split(/[@.]/)[0]):m&&m[4]?m[0].split(' ')[0]:'there';return s.replace(/\{f\}/g,fn).replace(/\{co\}/g,dd?dd.co:'your team')};
const tpL=()=>{const q=S.tq.toLowerCase(),r=TP.map((t,i)=>[t,i]).filter(([t])=>(t[1]=='m'?S.tmy:S.ttm)&&t[0].toLowerCase().includes(q));return r.length?r.map(([t,i])=>`<button class="tr2" data-a="tx2" data-v="${i}">${t[0]}${I(S.te==i?'down':'chev')}</button>${S.te==i?`<div class="tpb fi"><div class="mu">Subject</div><b>${fil(t[2])}</b><p>${es(fil(t[3]))}</p><div class="acr"><button class="bt" data-a="tins" data-v="${i}">${I('reply')}Insert into reply</button><button class="bt2" data-a="ts" data-v="Template copied">${I('copy')}Copy</button></div></div>`:''}`).join(''):`<div class="emp">${I('lines')}No templates match.</div>`};
const tpv=()=>`<div class="cd"><div class="bc"><button data-a="cp" data-v="">Content</button> &gt; <b style="color:var(--t);font-weight:500">Templates</b><button style="margin-left:auto;color:var(--t)" data-a="ts" data-v="The template editor opens in the full product">${I('plus')}Add new</button></div><div style="padding:6px 12px 12px"><label class="sx">${I('srch')}<input data-i="tq" placeholder="Search templates..." value="${es(S.tq)}"></label><div class="tck">${[['m','My Templates',S.tmy],['t','Team Templates',S.ttm]].map(x=>`<button data-a="tf" data-v="${x[0]}"><i class="${x[2]?'on':''}">${x[2]?I('chk'):''}</i>${x[1]}</button>`).join('')}</div><div id="gtl">${tpL()}</div></div></div>`;
function csd(){const q=S.cq.toLowerCase(),r=A.map((a,i)=>i).filter(i=>!q||(A[i][0]+A[i][2]).toLowerCase().includes(q));const c={};r.forEach(i=>c[A[i][2]]=(c[A[i][2]]||0)+1);
return`<div class="csd">${q?`<div class="chs">${Object.entries(c).map(([k,v])=>`<span>${k} (${v})</span>`).join('')}</div>`:`<div class="li cfl">${I('hist')}<div class="tt">pricing proposal</div></div>`}${r.length?r.map(arow).join(''):`<div class="emp">No results for "${es(S.cq)}"</div>`}</div>`}
function rCmp(){const d=D[S.d],m=S.menu;let pop='';
if(m=='plus'||m&&m.startsWith('sub:'))pop=`<div class="pop">${[['prompts','spark','Prompts'],['skills','bolt','Skills'],['conn','plug','Connectors']].map(([k,i,t])=>`<button class="${m=='sub:'+k?'on':''}" data-a="sub" data-v="${k}">${I(i)}${t}<span class="ar">${I('chev')}</span></button>`).join('')}<div class="sp"></div><button data-a="gc">${LG}GTM Buddy Content</button><button data-a="calls">${I('play')}Calls</button><button data-a="ts" data-v="File upload works in the full product">${I('clip')}Upload file</button></div>`+(m=='sub:prompts'?`<div class="pop s2">${PR.map(p=>`<button data-a="pr" data-v="${p[0]}">${I('wand')}${p[0]}<span class="ag">${p[1]} arg${p[1]>1?'s':''}</span></button>`).join('')}</div>`:m=='sub:skills'?`<div class="pop s2">${SK.map(s=>`<button data-a="pr" data-v="/${s}">${I('bolt')}${s}</button>`).join('')}</div>`:m=='sub:conn'?`<div class="pop s2">${['Salesforce','Gmail','Slack','Zoom','Google Drive'].map(c=>`<button data-a="cn" data-v="${c}">${I('plug')}${c}<span class="ag" style="${S.cn.has(c)?'background:#e7f6ec;color:#067647':''}">${S.cn.has(c)?'Connected':'Connect'}</span></button>`).join('')}</div>`:'');
if(m=='lang')pop=`<div class="pop rt">${LN.map(l=>`<button class="${l==S.lang?'on':''}" data-a="lang" data-v="${l}">${l}</button>`).join('')}</div>`;
